<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Atom</title>
    <link rel="stylesheet" href="color.css" />
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"

  </head>
  <body>

    <main>
      <section class="login-box">

        <div class="login-cart">
          <iconify-icon icon="eos-icons:atom-electron"></iconify-icon>
          <h1>Project <span>Apollo</span></h1>
          <p>Tu negocio. Organizado. Siempre</p>
        </div>

        <div class="welcome-text">
          <h2>Bienvenido de nuevo</h2>
          <p>Iniciar sesión para continuar</p>
        </div>

        <form class="login-form">
          <div class="input-box">
           <i class="fa-solid fa-envelope"></i>
            <input type="email" placeholder="Correo electrónico" />
          </div>

          <div class="input-box">
              <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Contraseña" />
              <i class="fa-solid fa-eye"></i>
          </div>

          <div class="form-optiones">
            <label>
              <input type="checkbox" />
              Recordarme
            </label>
            <a href="#">Olvidaste tu contraseña</a>
            <button type="submit">Iniciar sesión</button>
          </div>
        </form>

        <div class="separador">
          <span>Continuar con</span>
        </div>

        <div class="icono-sociales">
          <button>
           <iconify-icon icon="flat-color-icons:google"></iconify-icon>
           Google
          </button>
          <button>
            <i class="fa-brands fa-apple"></i>
            Apple
          </button>
        </div>

        <div class="registro-link">
          <p>¿No tienes una cuenta? <a href="#">Regístrate</a></p>
        </div>

        <div class="mensaje-final">
          <p>Tus datos están seguros con nosotros.</p>
        </div>

      </section>
    </main>
   <script src="app.js"></script>
  </body>
</html>
